name: Weekly content drip

# MOVED to Optimus LXC 105 cron (/root/cron-jobs/content-drip.sh) 2026-10-25; manual run only here.
# Posts one grounded forum thread + replies from content-drip/bank.json each
# week, so CastZone always shows recent activity. Runs in GitHub Actions
# because a Claude routine cannot reach Supabase, but Actions has full
# internet. See content-drip/README.md.

on:
  workflow_dispatch: {}   # lets you run it manually from the Actions tab to test

permissions:
  contents: write   # to commit the advanced state.json back

concurrency:
  group: content-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post next drip item
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python content-drip/post_drip.py

      - name: Commit advanced state
        run: |
          if git diff --quiet content-drip/state.json; then
            echo "No state change (bank may be exhausted) - nothing to commit."
            exit 0
          fi
          git config user.name "CastZone Drip Bot"
          git config user.email "drip@castzone.co.za"
          git add content-drip/state.json
          git commit -m "Content drip: advance state [skip ci]"
          git push
