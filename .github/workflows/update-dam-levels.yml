name: Update Dam Levels

# Refreshes weekly dam-level numbers in src/data/waterConditions.ts from the
# official DWS "Weekly State of Dams" pages, rebuilds the static site, and
# commits out/ so Cloudflare Pages auto-deploys. Fully automatic — replaces
# the old manual Monday update.
#
# Requires repo secrets (both are PUBLIC keys, already shipped in the client bundle):
#   SUPABASE_URL                     – e.g. https://zohgnpogjtjnozyweutg.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY    – the Supabase anon/publishable key
# These are needed at BUILD time so the /fishing-near pages keep their venue lists.

on:
  schedule:
    # 08:00 SAST (06:00 UTC) Monday & Thursday — catches the weekly DWS publish
    # plus any mid-week "latest available" refresh. Script is idempotent (no-op
    # if levels are unchanged), so the extra run is free.
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape DWS dam levels into waterConditions.ts
        run: python3 scripts/update_dam_levels.py

      - name: Stop early if no data change
        id: changed
        run: |
          if git diff --quiet src/data/waterConditions.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No level changes — nothing to build or deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true'
        run: npm ci

      - name: Build static site
        if: steps.changed.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Remove any iCloud/duplicate junk
        if: steps.changed.outputs.changed == 'true'
        run: find out -name '* 2*' -print -delete 2>/dev/null || true

      - name: Safety check — build must not be degraded
        if: steps.changed.outputs.changed == 'true'
        run: |
          # The Johannesburg fishing-near page must still list its venues. If it
          # doesn't, the build-time Supabase fetch failed (missing/expired anon
          # key or Supabase down) → abort so we never deploy an empty build.
          if ! grep -q 'href="/venues/' out/fishing-near/johannesburg.html; then
            echo "::error::Degraded build — /fishing-near/johannesburg has no venues. Aborting (not committing)."
            exit 1
          fi
          echo "Build looks healthy (fishing-near venues present)."

      - name: Commit & push (source + built out/)
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "CastZone Bot"
          git config user.email "bot@castzone.co.za"
          # NB: 'git add out/' (NOT -u) so newly-hashed chunk files are captured.
          git add src/data/waterConditions.ts out/
          git commit -m "Update dam levels $(date +'%Y-%m-%d') [skip ci]"
          git push
