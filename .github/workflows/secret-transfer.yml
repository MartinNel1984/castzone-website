name: Secret transfer (one-off)
on:
  workflow_dispatch:
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          WHATSAPP_GROUP_URL: ${{ secrets.WHATSAPP_GROUP_URL }}
        run: |
          cat > pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAuKe7fGcgLG3WfIvrUV0B
          dfonb5erdAWg0Z3/qc98zhCCJafo5Tkj1ZMouNKghDC/1lLPT0SyedQiOBQQTSPB
          XCJTLJfwOguyHTJF6aShwmxTJfAN9JQEo28RoF99btge0ik4+tCwRwQm0K5FZ6Il
          ZkVU4W1rPUuthpsBj1FAMFgFafD02Lo0JFN8g8RTcVdiiaL1AQdlsrYwVmu7AJVJ
          VFvTo4ViXdBtTB7W/XPl3ULOQLGpXy2tN7/Vpuka0xSsU8PtHS1CKUcqSDqVgZjD
          zC+RZbwhCoz6ue8QtDhXE0e13YMOBPc0Z9hWUCCZ5Jr0ftJFJ/0SDGLUIvFoqQVg
          1/Ug0MsfHcpjj5nxvc4ThkLiz/xM6lEAlOw2JFOBEfHg8QjDTURT23GJhYYQ4DXb
          PUDTkKe6ApxYllmODa58+tdo9ZFDEzIe2l6On97XZcVFxKLWwTbPCuRKmW4JIFmi
          u7rHZSblQvxXHPmTjtj49yKryLozTxkQ06sEWZRG0GyBAgMBAAE=
          -----END PUBLIC KEY-----
PEM
          for v in FB_PAGE_ID FB_PAGE_ACCESS_TOKEN UNSUBSCRIBE_SECRET WHATSAPP_GROUP_URL; do printf '%s=%s\n' "$v" "${!v}"; done > plain.env
          openssl rand -hex 32 > pass.txt
          openssl enc -aes-256-cbc -pbkdf2 -pass file:pass.txt -in plain.env -out enc.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in pass.txt -out pass.enc
          echo "ENCPASS:$(base64 -w0 pass.enc)"
          echo "ENCDATA:$(base64 -w0 enc.bin)"
