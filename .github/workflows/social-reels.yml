name: Monthly highlight reel

# Runs on the first Friday of each month at 09:00 SAST (07:00 UTC).
# Fetches top Trophy Room catches, generates a 9:16 MP4 slideshow with ffmpeg,
# and publishes it as an Instagram Reel + Facebook video post.
# See social-media/README.md for first-time setup.

on:
  schedule:
    # First Friday of the month 07:00 UTC (09:00 SAST).
    # "day-of-month 1-7 AND day-of-week 5 (Friday)" gives the first Friday.
    - cron: "0 7 1-7 * 5"
  workflow_dispatch: {}   # run manually from Actions tab to test

permissions:
  contents: read   # no state file to commit for the reel

concurrency:
  group: social-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ffmpeg + IG processing should finish well inside this

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install pillow

      - name: Generate and publish reel
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          FB_PAGE_ACCESS_TOKEN:  ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:            ${{ secrets.IG_USER_ID }}
        run: python social-media/make_reel.py
