name: Deals bot (Specials)

# Scans curated SA fishing/camping retailers for >= MIN_DISCOUNT% deals and
# queues them on /specials/review for Martin to approve.
# Reuses the same Supabase secrets as the content-drip bot.

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 SAST daily
  workflow_dispatch:
    inputs:
      min_discount:
        description: "Minimum discount % (default 40)"
        required: false
        default: "40"

jobs:
  find-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find deals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_API_PARAMS: ${{ vars.SCRAPER_API_PARAMS }}
          MIN_DISCOUNT: ${{ github.event.inputs.min_discount || '40' }}
          AUTO_APPROVE_PCT: ${{ vars.AUTO_APPROVE_PCT || '70' }}
          AUTO_APPROVE_MIN_PRICE: ${{ vars.AUTO_APPROVE_MIN_PRICE || '300' }}
        run: python3 deals-bot/fetch_deals.py
