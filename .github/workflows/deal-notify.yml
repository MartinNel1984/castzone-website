name: Deal notify (email + WhatsApp)

# Emails a rotating ~1/ROTATION_DAYS slice of members each day (never the
# whole list at once — see notify_deals.py header) + sends one WhatsApp
# group-teaser topic to Martin (specials / angler safety / bite times,
# see scripts/whatsapp_rotation.py — one topic per weekday, not all three
# every day). The on-site bell is handled by a DB trigger, not here.

on:
  schedule:
    - cron: "0 15 * * *"   # 17:00 SAST daily — one digest of the day's approvals
  workflow_dispatch:
    inputs:
      test_email:
        description: "Test send to THIS address only (members not emailed, marker untouched)"
        required: false
        default: ""
      test_topic:
        description: "Force the angler-safety/bite-times WhatsApp topic (safety|bite), ignoring today's weekday"
        required: false
        default: ""

permissions:
  contents: write   # commit the advanced marker

concurrency:
  group: deal-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://zohgnpogjtjnozyweutg.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ vars.MAIL_FROM || 'CastZone Deals <deals@castzone.co.za>' }}
      ROTATION_DAYS: ${{ vars.ROTATION_DAYS || '10' }}
      CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
      NOTIFY_WHATSAPP_NUMBER: ${{ secrets.NOTIFY_WHATSAPP_NUMBER }}
      WHATSAPP_GROUP_URL: ${{ secrets.WHATSAPP_GROUP_URL }}
      UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
      TEST_RECIPIENT: ${{ github.event.inputs.test_email }}
      STATE_FILE: .github/deal-notify-state.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Notify on newly-approved deals
        run: python3 deals-bot/notify_deals.py

      - name: Angler safety / bite times WhatsApp topic
        run: |
          if [ -n "${{ github.event.inputs.test_topic }}" ]; then
            python3 scripts/whatsapp_topics.py --topic="${{ github.event.inputs.test_topic }}"
          else
            python3 scripts/whatsapp_topics.py
          fi

      - name: Commit advanced marker
        run: |
          if [ -z "$(git status --porcelain -- "$STATE_FILE")" ]; then
            echo "No marker change — nothing to commit."
            exit 0
          fi
          git config user.name  "CastZone Deal Bot"
          git config user.email "deals@castzone.co.za"
          git add "$STATE_FILE"
          git commit -m "Deal notify: advance marker [skip ci]"
          git pull --rebase
          git push
