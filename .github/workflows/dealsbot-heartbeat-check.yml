name: Deals bot heartbeat check

# The deals bot itself runs on Martin's self-hosted Home Server (Windows/WSL,
# not GitHub Actions — migrated off the M2 MacBook 2026-07-15), so GHA can't
# reach it directly to ask "are you alive?" — it has no public endpoint.
# Instead, fetch_deals.py writes a heartbeat timestamp to Supabase at the end
# of every real run; this workflow just checks how stale that timestamp is
# and WhatsApps Martin ONLY if the Home Server looks like it's gone quiet
# (WSL down, machine off, or the bot itself is broken).
#
# Runs every 2h so a real outage (of any cause — not just the WSL-restart
# issue found + self-healed 2026-07-26, see project-secondhand-server-build
# memory) is caught within ~2h instead of waiting for a twice-daily check.
#
# Cron on the Home Server is `0 7,13,19 * * *` in Africa/Johannesburg (SAST,
# UTC+2) => runs at 05:00, 11:00, 17:00 UTC. The overnight gap (17:00 UTC ->
# next day's 05:00 UTC) is ~12h, so STALE_HOURS must clear that with margin
# or this fires a false alarm every night. (Found + fixed 2026-08-01: an
# earlier STALE_HOURS=5 was well under the 12h gap and paged Martin nightly
# for no reason.)

on:
  schedule:
    - cron: "0 */2 * * *"  # every 2 hours
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://zohgnpogjtjnozyweutg.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
      NOTIFY_WHATSAPP_NUMBER: ${{ secrets.NOTIFY_WHATSAPP_NUMBER }}
      STALE_HOURS: "14"
    steps:
      - name: Check heartbeat freshness
        run: |
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_SERVICE_KEY"]
          stale_hours = float(os.environ["STALE_HOURS"])

          req = urllib.request.Request(
              f"{url}/rest/v1/deals_bot_heartbeat?select=last_run_at&id=eq.1",
              headers={"apikey": key, "Authorization": f"Bearer {key}"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              rows = json.loads(resp.read().decode())

          msg = None
          if not rows:
              msg = ("CastZone deals bot: heartbeat table is empty — has "
                     "src/db/deals-bot-heartbeat.sql been run yet?")
          else:
              last = datetime.fromisoformat(rows[0]["last_run_at"].replace("Z", "+00:00"))
              age_hours = (datetime.now(timezone.utc) - last).total_seconds() / 3600
              print(f"Last heartbeat: {last.isoformat()} ({age_hours:.1f}h ago)")
              if age_hours > stale_hours:
                  msg = (f"CastZone deals bot on the Home Server hasn't checked in for "
                         f"{age_hours:.1f}h (last run {last.strftime('%Y-%m-%d %H:%M UTC')}). "
                         f"WSL may be down, the machine may be off, or the bot may be broken — please check.")

          if msg:
              print("ALERTING:", msg)
              callmebot_key = os.environ.get("CALLMEBOT_API_KEY")
              phone = os.environ.get("NOTIFY_WHATSAPP_NUMBER")
              if callmebot_key and phone:
                  qs = urllib.parse.urlencode({"phone": phone, "text": msg, "apikey": callmebot_key})
                  urllib.request.urlopen(f"https://api.callmebot.com/whatsapp.php?{qs}", timeout=20)
          else:
              print("Heartbeat is fresh — no alert.")
          EOF
