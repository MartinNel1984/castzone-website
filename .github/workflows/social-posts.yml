name: Weekly social posts

# Every Wednesday 08:00 SAST (06:00 UTC).
# Generates a branded post (tip card or catch spotlight), uploads the image to
# Supabase Storage, and sends Martin a WhatsApp with the ready-to-paste caption
# + image URL. Martin posts manually to Instagram and Facebook — takes ~2 min.

on:
  schedule:
    - cron: "0 6 * * 1,3,5"   # Mon/Wed/Fri 08:00 SAST (UTC+2)
  workflow_dispatch: {}    # run manually from Actions tab to test

permissions:
  contents: write   # to commit the advanced social-state.json back

concurrency:
  group: social-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          pip install pillow

      - name: Prepare post + send WhatsApp
        env:
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAKE_WEBHOOK_URL:        ${{ secrets.MAKE_WEBHOOK_URL }}
          CALLMEBOT_API_KEY:       ${{ secrets.CALLMEBOT_API_KEY }}
          NOTIFY_WHATSAPP_NUMBER:  ${{ secrets.NOTIFY_WHATSAPP_NUMBER }}
        run: python social-media/post_social.py

      - name: Commit advanced state
        run: |
          if git diff --quiet social-media/social-state.json; then
            echo "No state change — nothing to commit."
            exit 0
          fi
          git config user.name  "CastZone Social Bot"
          git config user.email "social@castzone.co.za"
          git add social-media/social-state.json
          git commit -m "Social post: advance state [skip ci]"
          git push
