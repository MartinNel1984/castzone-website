name: Social posts
# MOVED to Optimus LXC 105 cron (/root/cron-jobs/social-posts.sh) 2026-10-25; manual run only here.

# Daily: 05:00 SAST bite times, 12:00 SAST a special (skipped if no approved,
# unposted deal); Mon/Wed/Fri 08:00 SAST a tip or catch spotlight.
# Generates a branded post (tip card, catch spotlight, bite times or special), uploads the image to
# Supabase Storage, and posts it straight to the CastZone Facebook Page via
# the Meta Graph API. Sends Martin a WhatsApp confirmation with the post link.
# If the FB secrets are missing it WhatsApps the caption + image for manual
# posting instead (with a run warning), so nothing is ever silently dropped.

on:
  workflow_dispatch:       # run manually from Actions tab to test
    inputs:
      force_kind:
        description: "Post type to run now: bank, special or bite"
        required: false
        default: "bite"

permissions:
  contents: write   # to commit the advanced social-state.json back

concurrency:
  group: social-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # runs src/lib/solunar.ts directly (native TS support)

      - name: Install dependencies
        run: |
          pip install pillow

      - name: Prepare post + send WhatsApp
        env:
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_KIND:              ${{ github.event.inputs.force_kind }}
          SCHEDULE:                ${{ github.event.schedule }}
          FB_PAGE_ID:              ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:    ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          CALLMEBOT_API_KEY:       ${{ secrets.CALLMEBOT_API_KEY }}
          NOTIFY_WHATSAPP_NUMBER:  ${{ secrets.NOTIFY_WHATSAPP_NUMBER }}
        run: python social-media/post_social.py

      - name: Commit advanced state
        run: |
          if git diff --quiet social-media/social-state.json; then
            echo "No state change — nothing to commit."
            exit 0
          fi
          git config user.name  "CastZone Social Bot"
          git config user.email "social@castzone.co.za"
          git add social-media/social-state.json
          git commit -m "Social post: advance state [skip ci]"
          git pull --rebase -q origin main
          git push
